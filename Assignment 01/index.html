<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration and Result Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Page 1: Student Details -->
        <div id="page1">

            <h1>Student Registration</h1>

            <form id="studentForm">

                <label for="name">Student Name:</label>
                <input type="text" id="name" placeholder="Enter student name">

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter email">

                <label for="rollNo">Roll Number:</label>
                <input type="text" id="rollNo" placeholder="Enter roll number">

                <label for="course">Course:</label>
                <select id="course">
                    <option value="">Select Course</option>
                    <option value="MCA">MCA</option>
                    <option value="B.Tech">B. Tech</option>
                    <option value="MBA">MBA</option>
                    <option value="BBA">BBA</option>
                </select>

                <p id="message"></p>

                <button type="button" id="nextButton">
                    Next
                </button>

            </form>

        </div>


        <!-- Page 2: Subject Marks -->
        <div id="page2">

            <h1>Enter Subject Marks</h1>

            <form id="marksForm">

                <label for="python">Python + SQL Programming:</label>
                <input type="number" id="python" min="0" max="100">

                <label for="dsa">Data Structures & Algorithms:</label>
                <input type="number" id="dsa" min="0" max="100">

                <label for="database">Database Systems — SQL + NoSQL:</label>
                <input type="number" id="database" min="0" max="100">

                <label for="maths">Mathematical Foundations for AI:</label>
                <input type="number" id="maths" min="0" max="100">

                <label for="ai">Agentic AI Foundations:</label>
                <input type="number" id="ai" min="0" max="100">

                <label for="linux">Linux, Git & Dev Tooling:</label>
                <input type="number" id="linux" min="0" max="100">

                <label for="communication">Business Communications:</label>
                <input type="number" id="communication" min="0" max="100">

                <label for="fullstack">Full Stack Development:</label>
                <input type="number" id="fullstack" min="0" max="100">

                <p id="marksMessage"></p>

                <button type="button" id="backButton">
                    Back
                </button>

                <button type="button" id="resultButton">
                    View Result
                </button>

            </form>

        </div>


        <!-- Page 3: Result -->
        <div id="page3">

            <h1>Student Result</h1>

            <div id="studentDetails"></div>

            <h3>Subject-wise Marks</h3>

            <div id="result"></div>

            <div id="summary"></div>

            <button type="button" id="newStudentButton">
                Register Another Student
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
